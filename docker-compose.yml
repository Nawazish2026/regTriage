version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: regtriage-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: regtriage
      POSTGRES_PASSWORD: regtriage_dev
      POSTGRES_DB: regtriage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regtriage"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
